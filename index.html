<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD PAT 磁磚設計師</title>
  <meta name="description" content="在瀏覽器中設計 AutoCAD .PAT 剖面線圖案，即時預覽並匯出標準格式檔案">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg0: #0a0e17;
      --bg1: #111827;
      --bg2: #1a2235;
      --bg3: #232f44;
      --bg4: #2d3a52;
      --border: #2a3a54;
      --border2: #3d4f6e;
      --txt0: #e8edf8;
      --txt1: #9daec7;
      --txt2: #5f748f;
      --accent: #3b82f6;
      --accent2: #60a5fa;
      --accent-dim: #1d3461;
      --purple: #a78bfa;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --cyan: #22d3ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg0);
      color: var(--txt0);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 16px rgba(0, 0, 0, .4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #3b82f6, #a78bfa);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .logo-name {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--txt2);
      -webkit-text-fill-color: var(--txt2);
      display: block;
      margin-top: -2px
    }

    .header-mid {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .hdr-inp {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--txt0);
      font-size: 13px;
      padding: 6px 10px;
      transition: border-color .2s;
    }

    .hdr-inp:focus {
      outline: none;
      border-color: var(--accent)
    }

    #pat-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      text-transform: uppercase;
      width: 160px;
      letter-spacing: .5px
    }

    #pat-desc {
      flex: 1;
      max-width: 340px;
      color: var(--txt1)
    }

    .hdr-actions {
      display: flex;
      gap: 8px;
      align-items: center
    }

    /* ── Buttons ── */
    .btn {
      padding: 6px 13px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn-pri {
      background: var(--accent);
      color: #fff
    }

    .btn-pri:hover {
      background: var(--accent2);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, .35)
    }

    .btn-sec {
      background: var(--bg2);
      color: var(--txt0);
      border: 1px solid var(--border)
    }

    .btn-sec:hover {
      background: var(--bg3);
      border-color: var(--border2)
    }

    .btn-ghost {
      background: transparent;
      color: var(--txt1);
      border: 1px solid transparent;
      padding: 5px 10px
    }

    .btn-ghost:hover {
      background: var(--bg3);
      color: var(--txt0)
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 5px;
      font-size: 16px;
      justify-content: center
    }

    .btn-danger {
      color: var(--red);
      background: transparent;
      border: 1px solid transparent
    }

    .btn-danger:hover {
      background: rgba(248, 113, 113, .1);
      border-color: var(--red)
    }

    /* ── Workspace ── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden
    }

    /* ── Left Panel ── */
    .panel-l {
      width: 210px;
      flex-shrink: 0;
      background: var(--bg1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .panel-hd {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-ttl {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--txt2);
    }

    .family-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px
    }

    .fam-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      border: 1px solid transparent;
      transition: all .15s;
    }

    .fam-item:hover {
      background: var(--bg2)
    }

    .fam-item.active {
      background: var(--accent-dim);
      border-color: var(--accent)
    }

    .fam-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .fam-info {
      flex: 1;
      min-width: 0
    }

    .fam-name {
      font-size: 12.5px;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace
    }

    .fam-detail {
      font-size: 10.5px;
      color: var(--txt2);
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .fam-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity .15s
    }

    .fam-item:hover .fam-actions {
      opacity: 1
    }

    .fam-item.active .fam-actions {
      opacity: 1
    }

    .fam-btn {
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      color: var(--txt2);
    }

    .fam-btn:hover {
      background: var(--bg4);
      color: var(--txt0)
    }

    .fam-btn.del:hover {
      color: var(--red)
    }

    /* Presets */
    .presets-box {
      border-top: 1px solid var(--border);
      padding: 8px
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 6px
    }

    .preset-btn {
      padding: 5px 6px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--txt1);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all .15s;
      font-family: 'JetBrains Mono', monospace;
    }

    .preset-btn:hover {
      background: var(--bg3);
      color: var(--txt0);
      border-color: var(--accent)
    }

    /* ── Canvas Area ── */
    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg0)
    }

    .canvas-bar {
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg1);
      flex-shrink: 0;
    }

    .bar-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--txt1)
    }

    .bar-item label {
      color: var(--txt2);
      font-size: 11px
    }

    .sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 2px
    }

    input[type=range] {
      accent-color: var(--accent);
      width: 70px;
      cursor: pointer
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--txt2)
    }

    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #cv {
      cursor: crosshair;
      display: block
    }

    /* Toggle */
    .tog {
      position: relative;
      display: inline-block;
      width: 30px;
      height: 17px
    }

    .tog input {
      opacity: 0;
      width: 0;
      height: 0
    }

    .tog-sl {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--bg4);
      border-radius: 17px;
      transition: .2s;
    }

    .tog-sl::before {
      content: '';
      position: absolute;
      height: 11px;
      width: 11px;
      left: 3px;
      bottom: 3px;
      background: var(--txt2);
      border-radius: 50%;
      transition: .2s;
    }

    .tog input:checked+.tog-sl {
      background: var(--accent-dim)
    }

    .tog input:checked+.tog-sl::before {
      transform: translateX(13px);
      background: var(--accent2)
    }

    /* ── Right Panel ── */
    .panel-r {
      width: 290px;
      flex-shrink: 0;
      background: var(--bg1);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-r-scroll {
      flex: 1;
      overflow-y: auto
    }

    .params-sec {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border)
    }

    .ps-ttl {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--txt2);
      margin-bottom: 10px;
    }

    .pr {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px
    }

    .pr label {
      font-size: 12px;
      color: var(--txt1);
      width: 72px;
      flex-shrink: 0
    }

    .pi {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--txt0);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      padding: 5px 8px;
      transition: border-color .2s;
    }

    .pi:focus {
      outline: none;
      border-color: var(--accent)
    }

    .pu {
      font-size: 11px;
      color: var(--txt2);
      width: 22px;
      text-align: right;
      flex-shrink: 0
    }

    /* Angle viz */
    #angle-viz {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg0);
      cursor: pointer;
      flex-shrink: 0;
      display: block;
    }

    input[type=color].color-pi {
      width: 38px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px;
      background: var(--bg2);
      cursor: pointer;
    }

    /* PAT code box */
    .pat-box {
      padding: 12px 14px;
      border-top: 1px solid var(--border)
    }

    .pat-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px
    }

    .pat-code {
      background: var(--bg0);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--txt1);
      white-space: pre;
      overflow: auto;
      line-height: 1.7;
      max-height: 200px;
    }

    .pc-comment {
      color: var(--txt2)
    }

    .pc-header {
      color: var(--purple)
    }

    .pc-data {
      color: var(--cyan)
    }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--txt2);
      padding: 30px;
      text-align: center;
    }

    .empty .ei {
      font-size: 36px;
      opacity: .25
    }

    .empty p {
      font-size: 12.5px;
      line-height: 1.5
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
      z-index: 9999;
      opacity: 0;
      transform: translateY(8px);
      transition: all .25s;
      pointer-events: none;
    }

    .toast.on {
      opacity: 1;
      transform: translateY(0)
    }

    .toast.ok {
      border-color: var(--green);
      color: var(--green)
    }

    .toast.err {
      border-color: var(--red);
      color: var(--red)
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 3px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--txt2)
    }

    /* Coord display */
    .coord-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--txt2);
      pointer-events: none;
      background: rgba(10, 14, 23, .7);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .reset-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--txt1);
      cursor: pointer;
    }

    .reset-btn:hover {
      background: var(--bg3);
      color: var(--txt0)
    }
  </style>
</head>

<body>

  <!-- ═══ HEADER ═══ -->
  <header>
    <div class="logo">
      <div class="logo-icon">◈</div>
      <div>
        <div class="logo-name">PAT Designer</div>
        <span class="logo-sub">CAD 磁磚圖案設計師</span>
      </div>
    </div>

    <div class="header-mid">
      <input id="pat-name" class="hdr-inp" type="text" value="MYPAT" maxlength="31" placeholder="PATTERN_NAME"
        title="圖案名稱 (英數字及底線)" oninput="onMetaChange()">
      <input id="pat-desc" class="hdr-inp" type="text" value="自製磁磚圖案" placeholder="描述說明..." oninput="onMetaChange()">
    </div>

    <div class="hdr-actions">
      <button class="btn btn-sec" onclick="importPAT()" title="匯入現有 .PAT 檔">↑ 匯入</button>
      <button class="btn btn-pri" onclick="exportPAT()">↓ 匯出 .PAT</button>
      <input id="file-input" type="file" accept=".pat,.txt" style="display:none" onchange="onFile(event)">
    </div>
  </header>

  <!-- ═══ WORKSPACE ═══ -->
  <div class="workspace">

    <!-- Left: Family List -->
    <aside class="panel-l">
      <div class="panel-hd">
        <span class="panel-ttl">線族 Families</span>
        <button class="btn btn-sec btn-icon" onclick="addFamily()" title="新增線族 (+)">+</button>
      </div>
      <div class="family-list" id="fam-list">
        <div class="empty">
          <div class="ei">⊞</div>
          <p>點擊 + 新增線族<br>或選擇下方預設圖案</p>
        </div>
      </div>
      <div class="presets-box">
        <div class="panel-ttl">預設圖案 Presets</div>
        <div class="preset-grid" id="preset-grid"></div>
      </div>
    </aside>

    <!-- Center: Canvas -->
    <main class="canvas-area">
      <div class="canvas-bar">
        <div class="bar-item">
          <label>縮放</label>
          <input type="range" id="scale-sl" min="15" max="400" value="80" oninput="setScale(+this.value)">
          <span class="mono" id="scale-lbl">80</span>
        </div>
        <div class="sep"></div>
        <div class="bar-item">
          <label class="tog"><input type="checkbox" id="tog-grid" checked onchange="renderCV()"><span
              class="tog-sl"></span></label>
          格線
        </div>
        <div class="bar-item">
          <label class="tog"><input type="checkbox" id="tog-axes" checked onchange="renderCV()"><span
              class="tog-sl"></span></label>
          座標軸
        </div>
        <div class="sep"></div>
        <div class="bar-item">
          <label>背景</label>
          <input type="color" id="bg-col" value="#0a0e17"
            style="width:34px;height:24px;border:1px solid var(--border);border-radius:4px;padding:2px;background:var(--bg2);cursor:pointer"
            oninput="renderCV()">
        </div>
        <div style="margin-left:auto;font-size:10.5px;color:var(--txt2)">
          滾輪縮放 · 右鍵拖移 · 雙擊重置
        </div>
      </div>

      <div class="canvas-wrap" id="cv-wrap">
        <canvas id="cv"></canvas>
        <div class="coord-overlay" id="coord-lbl">x: 0.000 y: 0.000</div>
        <button class="reset-btn" onclick="resetView()">重置視圖</button>
      </div>
    </main>

    <!-- Right: Params -->
    <aside class="panel-r">
      <div class="panel-r-scroll" id="params-scroll">
        <div id="params-body">
          <div class="empty" style="height:220px">
            <div class="ei">✏</div>
            <p>選擇左側線族<br>以編輯其參數</p>
          </div>
        </div>
      </div>

      <div class="pat-box">
        <div class="pat-hd">
          <span class="panel-ttl" style="font-size:10.5px">PAT 輸出</span>
          <button class="btn btn-ghost" style="font-size:11px;padding:3px 8px" onclick="copyPAT()">複製</button>
        </div>
        <div class="pat-code" id="pat-out"></div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ════════════════════════════════════════
    //  CONSTANTS
    // ════════════════════════════════════════
    const COLORS = [
      '#22d3ee', '#a78bfa', '#34d399', '#fbbf24',
      '#f87171', '#60a5fa', '#fb923c', '#86efac',
    ];

    const PRESETS = {
      ANSI31: {
        desc: 'ANSI Iron, Brick, Stone',
        fams: [{ angle: 45, x0: 0, y0: 0, dx: 0, dy: .125, dashes: '', col: '#22d3ee' }]
      },
      ANSI32: {
        desc: 'ANSI Steel (Cross-Hatch)',
        fams: [
          { angle: 45, x0: 0, y0: 0, dx: 0, dy: .125, dashes: '', col: '#22d3ee' },
          { angle: -45, x0: 0, y0: 0, dx: 0, dy: .125, dashes: '', col: '#22d3ee' },
        ]
      },
      ANSI33: {
        desc: 'ANSI Bronze / Brass',
        fams: [
          { angle: 45, x0: 0, y0: 0, dx: 0, dy: .125, dashes: '', col: '#fbbf24' },
          { angle: 45, x0: 0, y0: .0625, dx: 0, dy: .125, dashes: '0.0625,-0.0625', col: '#fbbf24' },
        ]
      },
      NET: {
        desc: '方格 Grid',
        fams: [
          { angle: 0, x0: 0, y0: 0, dx: 0, dy: .25, dashes: '', col: '#60a5fa' },
          { angle: 90, x0: 0, y0: 0, dx: 0, dy: .25, dashes: '', col: '#60a5fa' },
        ]
      },
      BRICK: {
        desc: '磚塊 Brick / Masonry',
        fams: [
          { angle: 0, x0: 0, y0: 0, dx: 0, dy: .25, dashes: '', col: '#fb923c' },
          { angle: 90, x0: 0, y0: 0, dx: .25, dy: .25, dashes: '.25,-.25', col: '#fb923c' },
        ]
      },
      DASH45: {
        desc: '斜虛線 Dashed 45°',
        fams: [{ angle: 45, x0: 0, y0: 0, dx: 0, dy: .15, dashes: '.1,-.05', col: '#34d399' }]
      },
      DOTS: {
        desc: '點矩陣 Dot Matrix',
        fams: [{ angle: 0, x0: 0, y0: 0, dx: 0, dy: .2, dashes: '0,-.2', col: '#a78bfa' }]
      },
      HEX: {
        desc: '六角形 Hexagon (Honeycomb)',
        fams: [
          { angle: 0, x0: 0, y0: 0, dx: .375, dy: .21650635, dashes: '.25,-.5', col: '#22d3ee' },
          { angle: 120, x0: 0, y0: 0, dx: .375, dy: .21650635, dashes: '.25,-.5', col: '#22d3ee' },
          { angle: 60, x0: 0, y0: 0, dx: .375, dy: .21650635, dashes: '-.5,.25', col: '#22d3ee' },
        ]
      },
      SLIM_BRICK: {
        desc: '細長磚紋 Slim Brick (3:1)',
        fams: [
          // 水平縫
          { angle: 0, x0: 0, y0: 0, dx: 0, dy: .2, dashes: '', col: '#fb923c' },
          // 奇數行垂直縫
          { angle: 90, x0: 0, y0: 0, dx: 0, dy: .6, dashes: '.2,-.2', col: '#fb923c' },
          // 偶數行垂直縫（x 偏移半磚，y 偏移一磚高）
          { angle: 90, x0: .3, y0: .2, dx: 0, dy: .6, dashes: '.2,-.2', col: '#fb923c' },
        ]
      },
      STEP_BOND: {
        desc: '交錯積木 Step Bond',
        fams: [
          { angle: 0, x0: 0, y0: 0, dx: 0, dy: 1, dashes: '', col: '#60a5fa' },
          { angle: 90, x0: 0, y0: 0, dx: 0, dy: 1, dashes: '', col: '#60a5fa' },
          { angle: 0, x0: 0, y0: .7, dx: 0, dy: 1, dashes: '1,-1', col: '#f87171' },
          { angle: 0, x0: 1, y0: .3, dx: 0, dy: 1, dashes: '1,-1', col: '#fbbf24' },
        ]
      },
    };

    // ════════════════════════════════════════
    //  STATE
    // ════════════════════════════════════════
    const S = {
      fams: [],        // family objects
      sel: -1,         // selected family index
      scale: 80,       // px per unit
      panX: 0,
      panY: 0,
      drag: false,
      dragX: 0,
      dragY: 0,
      angleDrag: false,
      angleFamIdx: -1,
    };

    function mkFam(overrides = {}) {
      const idx = S.fams.length;
      return {
        angle: 45, x0: 0, y0: 0, dx: 0, dy: .125,
        dashes: '', col: COLORS[idx % COLORS.length],
        vis: true, id: Date.now() + Math.random(),
        ...overrides,
      };
    }

    // ════════════════════════════════════════
    //  FAMILY MANAGEMENT
    // ════════════════════════════════════════
    function addFamily(fam) {
      S.fams.push(fam || mkFam());
      S.sel = S.fams.length - 1;
      renderAll();
    }

    function removeFamily(i) {
      S.fams.splice(i, 1);
      if (S.sel >= S.fams.length) S.sel = S.fams.length - 1;
      renderAll();
    }

    function selFamily(i) {
      S.sel = i;
      renderFamList();
      renderParams();
    }

    function toggleVis(i) {
      S.fams[i].vis = !S.fams[i].vis;
      renderFamList();
      renderCV();
    }

    function dupFamily(i) {
      const copy = { ...S.fams[i], id: Date.now() + Math.random(), col: COLORS[S.fams.length % COLORS.length] };
      S.fams.splice(i + 1, 0, copy);
      S.sel = i + 1;
      renderAll();
    }

    function loadPreset(name) {
      const p = PRESETS[name];
      if (!p) return;
      document.getElementById('pat-name').value = name;
      document.getElementById('pat-desc').value = p.desc;
      S.fams = p.fams.map((f, i) => ({ ...f, vis: true, id: Date.now() + i }));
      S.sel = 0;
      renderAll();
    }

    // ════════════════════════════════════════
    //  PARAM UPDATE (no re-render of inputs)
    // ════════════════════════════════════════
    function updateFam(field, val) {
      if (S.sel < 0) return;
      S.fams[S.sel][field] = val;
      renderFamList();
      renderAngleViz();
      renderCV();
      renderPATOut();
      updateSpacingHint();
    }

    function updateSpacingHint() {
      const hp = document.getElementById('hint-perp');
      const hph = document.getElementById('hint-phase');
      if (!hp || !hph) return;
      const f = S.fams[S.sel];
      if (!f) return;
      const perp = Math.abs(f.dy);
      const phase = f.dx;
      const perpColor = perp < 1e-9 ? 'var(--red)' : 'var(--green)';
      hp.innerHTML = `垂直間距 (ΔY): <span style="color:${perpColor};font-weight:600">${perp.toFixed(5)} u</span>`
        + (perp < 1e-9 ? ' ⚠ 間距為 0，只會畫一條線！' : '');
      hph.innerHTML = `沿線位移 (ΔX): <span style="color:var(--cyan)">${phase.toFixed(5)} u</span>`;
    }

    function onMetaChange() {
      renderPATOut();
    }

    // ════════════════════════════════════════
    //  RENDER: FAMILY LIST
    // ════════════════════════════════════════
    function renderFamList() {
      const el = document.getElementById('fam-list');
      if (!S.fams.length) {
        el.innerHTML = '<div class="empty"><div class="ei">⊞</div><p>點擊 + 新增線族<br>或選擇下方預設圖案</p></div>';
        return;
      }
      el.innerHTML = S.fams.map((f, i) => `
    <div class="fam-item ${i === S.sel ? 'active' : ''}" onclick="selFamily(${i})">
      <div class="fam-dot" style="background:${f.col};${!f.vis ? 'opacity:.35' : ''}"></div>
      <div class="fam-info">
        <div class="fam-name" style="${!f.vis ? 'opacity:.4' : ''}">Family ${i + 1}</div>
        <div class="fam-detail">${f.angle}°&nbsp;·&nbsp;Δ(${f.dx},${f.dy})</div>
      </div>
      <div class="fam-actions">
        <button class="fam-btn" onclick="event.stopPropagation();toggleVis(${i})" title="${f.vis ? '隱藏' : '顯示'}">
          ${f.vis ? '👁' : '◌'}
        </button>
        <button class="fam-btn" onclick="event.stopPropagation();dupFamily(${i})" title="複製">⊕</button>
        <button class="fam-btn del" onclick="event.stopPropagation();removeFamily(${i})" title="刪除">✕</button>
      </div>
    </div>
  `).join('');
    }

    // ════════════════════════════════════════
    //  RENDER: PARAMS PANEL
    // ════════════════════════════════════════
    function renderParams() {
      const body = document.getElementById('params-body');
      const i = S.sel;
      if (i < 0 || i >= S.fams.length) {
        body.innerHTML = '<div class="empty" style="height:220px"><div class="ei">✏</div><p>選擇左側線族<br>以編輯其參數</p></div>';
        return;
      }
      const f = S.fams[i];
      body.innerHTML = `
    <div class="params-sec">
      <div class="ps-ttl">Family ${i + 1} — 線條方向</div>

      <div class="pr">
        <label>角度 Angle</label>
        <canvas id="angle-viz" width="38" height="38"
          onmousedown="startAngleDrag(event,${i})" title="拖動圓形設定角度"></canvas>
        <input class="pi" style="width:62px" type="number" id="pi-angle"
          value="${f.angle}" step="1" min="-360" max="360"
          oninput="updateFam('angle',+this.value||0)">
        <span class="pu">°</span>
      </div>
    </div>

    <div class="params-sec">
      <div class="ps-ttl">原點 Origin</div>
      <div class="pr">
        <label>X₀</label>
        <input class="pi" type="number" id="pi-x0" value="${f.x0}" step="0.0625"
          oninput="updateFam('x0',+this.value||0)">
        <span class="pu">u</span>
      </div>
      <div class="pr">
        <label>Y₀</label>
        <input class="pi" type="number" id="pi-y0" value="${f.y0}" step="0.0625"
          oninput="updateFam('y0',+this.value||0)">
        <span class="pu">u</span>
      </div>
    </div>

    <div class="params-sec">
      <div class="ps-ttl">偏移量 Delta</div>
      <div class="pr">
        <label>Δ X</label>
        <input class="pi" type="number" id="pi-dx" value="${f.dx}" step="0.0625"
          oninput="updateFam('dx',+this.value||0)">
        <span class="pu">u</span>
      </div>
      <div class="pr">
        <label>Δ Y</label>
        <input class="pi" type="number" id="pi-dy" value="${f.dy}" step="0.0625"
          oninput="updateFam('dy',+this.value||0)">
        <span class="pu">u</span>
      </div>
      <div style="font-size:10.5px;color:var(--txt2);margin-top:4px;line-height:1.8;background:var(--bg0);border-radius:4px;padding:5px 8px;border:1px solid var(--border)">
        <span id="hint-perp"></span><br>
        <span id="hint-phase"></span>
      </div>
    </div>

    <div class="params-sec">
      <div class="ps-ttl">虛線 Dashes
        <span style="text-transform:none;font-weight:400;font-size:9.5px;color:var(--txt2)">
          正=線 · 負=空 · 0=點
        </span>
      </div>
      <div class="pr">
        <label>序列</label>
        <input class="pi" type="text" id="pi-dashes" value="${f.dashes}"
          placeholder="如: 0.2,-0.05,0,-0.05"
          oninput="updateFam('dashes',this.value)">
      </div>
      <div style="font-size:10.5px;color:var(--txt2);margin-top:4px">
        留空 = 實線 / Solid line
      </div>
    </div>

    <div class="params-sec" style="border-bottom:none">
      <div class="ps-ttl">顯示 Display</div>
      <div class="pr">
        <label>顏色</label>
        <input type="color" class="color-pi" id="pi-col" value="${f.col}"
          oninput="updateFam('col',this.value)">
        <span style="font-size:11px;color:var(--txt2);margin-left:6px">（僅影響預覽顏色）</span>
      </div>
    </div>
  `;
      renderAngleViz();
      updateSpacingHint();
    }

    // ════════════════════════════════════════
    //  ANGLE VISUALIZER
    // ════════════════════════════════════════
    function renderAngleViz() {
      const cv = document.getElementById('angle-viz');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const W = cv.width, H = cv.height;
      const cx = W / 2, cy = H / 2, r = W / 2 - 2;
      ctx.clearRect(0, 0, W, H);

      // BG circle
      ctx.fillStyle = '#0a0e17';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

      // Ring
      ctx.strokeStyle = '#2a3a54'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

      const f = S.fams[S.sel];
      if (!f) return;
      const θ = f.angle * Math.PI / 180;
      const len = r - 4;

      // Line indicator
      ctx.strokeStyle = f.col; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - Math.cos(θ) * len, cy + Math.sin(θ) * len);
      ctx.lineTo(cx + Math.cos(θ) * len, cy - Math.sin(θ) * len);
      ctx.stroke();

      // Dot
      ctx.fillStyle = f.col;
      ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    // Angle drag
    let _adEl = null;
    function startAngleDrag(e, idx) {
      S.angleDrag = true; S.angleFamIdx = idx;
      _adEl = e.currentTarget;
      updateAngleFromMouse(e);
      e.preventDefault();
    }
    document.addEventListener('mousemove', e => {
      if (!S.angleDrag) return;
      updateAngleFromMouse(e);
    });
    document.addEventListener('mouseup', () => { S.angleDrag = false; });

    function updateAngleFromMouse(e) {
      if (!_adEl) return;
      const rect = _adEl.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = -(e.clientY - (rect.top + rect.height / 2));
      const angle = Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
      S.fams[S.angleFamIdx].angle = angle;
      const inp = document.getElementById('pi-angle');
      if (inp) inp.value = angle;
      renderAngleViz();
      renderFamList();
      renderCV();
      renderPATOut();
    }

    // ════════════════════════════════════════
    //  PAT MATH UTILITIES
    // ════════════════════════════════════════
    function parseDashes(str) {
      if (!str || !str.trim()) return [];
      return str.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
    }

    function fmtN(n) {
      const s = parseFloat(n.toFixed(8)).toString();
      return s === '-0' ? '0' : s;
    }

    // ════════════════════════════════════════
    //  CANVAS RENDERING
    // ════════════════════════════════════════
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function resizeCV() {
      const wrap = document.getElementById('cv-wrap');
      cv.width = wrap.clientWidth;
      cv.height = wrap.clientHeight;
    }

    function renderCV() {
      const W = cv.width, H = cv.height;
      const s = S.scale;
      const ox = W / 2 + S.panX;   // canvas X of world origin
      const oy = H / 2 + S.panY;   // canvas Y of world origin

      // background
      ctx.fillStyle = document.getElementById('bg-col').value;
      ctx.fillRect(0, 0, W, H);

      // grid
      if (document.getElementById('tog-grid').checked) drawGrid(ctx, s, W, H, ox, oy);

      // axes
      if (document.getElementById('tog-axes').checked) drawAxes(ctx, s, W, H, ox, oy);

      // hatch families
      ctx.save();
      for (const f of S.fams) {
        if (!f.vis) continue;
        drawFamily(ctx, f, s, W, H, ox, oy);
      }
      ctx.restore();

      // origin dot
      if (document.getElementById('tog-axes').checked) {
        ctx.fillStyle = 'rgba(59,130,246,.7)';
        ctx.beginPath(); ctx.arc(ox, oy, 3, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawGrid(ctx, s, W, H, ox, oy) {
      const minStep = 0.25 * s;

      // Minor
      ctx.strokeStyle = 'rgba(42,58,84,.7)'; ctx.lineWidth = .5;
      for (let x = ((0 - ox) / minStep | 0) - 1; x <= ((W - ox) / minStep | 0) + 1; x++) {
        const px = ox + x * minStep;
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
      }
      for (let y = ((0 - oy) / minStep | 0) - 1; y <= ((H - oy) / minStep | 0) + 1; y++) {
        const py = oy + y * minStep;
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
      }

      // Major (1u)
      const majStep = s;
      ctx.strokeStyle = 'rgba(61,79,110,.6)'; ctx.lineWidth = .8;
      ctx.font = '9px JetBrains Mono,monospace';
      for (let x = ((0 - ox) / majStep | 0) - 1; x <= ((W - ox) / majStep | 0) + 1; x++) {
        const px = ox + x * majStep;
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
        if (x !== 0) { ctx.fillStyle = 'rgba(95,116,143,.4)'; ctx.fillText(x, px + 2, oy - 3); }
      }
      for (let y = ((0 - oy) / majStep | 0) - 1; y <= ((H - oy) / majStep | 0) + 1; y++) {
        const py = oy + y * majStep;
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
        if (y !== 0) { ctx.fillStyle = 'rgba(95,116,143,.4)'; ctx.fillText(-y, ox + 3, py - 3); }
      }
    }

    function drawAxes(ctx, s, W, H, ox, oy) {
      ctx.strokeStyle = 'rgba(59,130,246,.25)'; ctx.lineWidth = 1;
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawFamily(ctx, f, s, W, H, ox, oy) {
      const { angle, x0, y0, dx, dy, dashes: dashStr, col } = f;
      const dashes = parseDashes(dashStr);
      const θ = angle * Math.PI / 180;
      const cosθ = Math.cos(θ), sinθ = Math.sin(θ);

      // In AutoCAD PAT:
      // dy is the perpendicular distance between lines (perpStep)
      // dx is the displacement along the line direction per line step (alongStep)
      const perpStep = dy;
      const alongStep = dx;

      // Viewport in world coords
      const wpX = -ox / s, wpW = (W - ox) / s, wpB = (oy - H) / s, wpT = oy / s;

      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 1.5;

      if (Math.abs(perpStep) < 1e-9) {
        // All lines coincide (perp spacing is 0) — draw k=0 only
        drawLine(ctx, x0, y0, cosθ, sinθ, dashes, 0, s, W, H, ox, oy, col);
        return;
      }

      // The perpendicular direction in world space is: (-sinθ, cosθ)
      const pX = -sinθ, pY = cosθ;
      // Perpendicular offset of the base (k=0) line from origin (0,0)
      const basePerp = x0 * pX + y0 * pY;

      // Project viewport corners onto the perpendicular direction to find the range of k
      const corners = [
        (wpX - 2) * pX + (wpB - 2) * pY, (wpW + 2) * pX + (wpB - 2) * pY,
        (wpW + 2) * pX + (wpT + 2) * pY, (wpX - 2) * pX + (wpT + 2) * pY,
      ];
      const minP = Math.min(...corners), maxP = Math.max(...corners);

      const kRaw1 = (minP - basePerp) / perpStep;
      const kRaw2 = (maxP - basePerp) / perpStep;
      const kMin = Math.floor(Math.min(kRaw1, kRaw2)) - 1;
      const kMax = Math.ceil(Math.max(kRaw1, kRaw2)) + 1;

      // Safety cap
      const MAX_LINES = 600;
      const total = kMax - kMin;
      const step = total > MAX_LINES ? Math.ceil(total / MAX_LINES) : 1;

      for (let k = kMin; k <= kMax; k += step) {
        // Shift origin by both perpendicular (dy) and along-line (dx) displacements in world coordinates.
        // This aligns the line's internal parameter t=0 with the CAD family starting point.
        const px = x0 + k * (dx * cosθ - dy * sinθ);
        const py = y0 + k * (dx * sinθ + dy * cosθ);
        drawLine(ctx, px, py, cosθ, sinθ, dashes, 0, s, W, H, ox, oy, col);
      }
    }

    // Draw a single infinite line through world point (wx,wy) at angle θ
    function drawLine(ctx, wx, wy, cosθ, sinθ, dashes, phaseOffset, s, W, H, ox, oy, col) {
      // Viewport in world coords
      const wL = -ox / s, wR = (W - ox) / s, wB = (oy - H) / s, wT = oy / s;
      const EPS = 1e-9;
      let tMin = -1e12, tMax = 1e12;

      if (Math.abs(cosθ) > EPS) {
        const t1 = (wL - wx) / cosθ, t2 = (wR - wx) / cosθ;
        tMin = Math.max(tMin, Math.min(t1, t2));
        tMax = Math.min(tMax, Math.max(t1, t2));
      } else {
        if (wx < wL || wx > wR) return;
      }

      if (Math.abs(sinθ) > EPS) {
        const t1 = (wB - wy) / sinθ, t2 = (wT - wy) / sinθ;
        tMin = Math.max(tMin, Math.min(t1, t2));
        tMax = Math.min(tMax, Math.max(t1, t2));
      } else {
        if (wy < wB || wy > wT) return;
      }

      if (tMin >= tMax - EPS) return;

      if (!dashes.length) {
        // Solid line
        ctx.beginPath();
        ctx.moveTo(ox + (wx + tMin * cosθ) * s, oy - (wy + tMin * sinθ) * s);
        ctx.lineTo(ox + (wx + tMax * cosθ) * s, oy - (wy + tMax * sinθ) * s);
        ctx.stroke();
        return;
      }

      // Dashed
      const totalLen = dashes.reduce((a, d) => a + Math.abs(d), 0);
      if (totalLen < EPS) return;

      // Cycle position at tMin
      let cyclePos = ((tMin - phaseOffset) % totalLen + totalLen) % totalLen;

      // Find starting segment
      let dashIdx = 0, segStart = 0;
      for (let i = 0; i < dashes.length; i++) {
        const sl = Math.abs(dashes[i]);
        if (segStart + sl > cyclePos + EPS) { dashIdx = i; break; }
        segStart += sl;
        if (i === dashes.length - 1) { dashIdx = 0; segStart = 0; }
      }
      let posInSeg = cyclePos - segStart;
      let t = tMin;
      let guard = 0;

      while (t < tMax - EPS && guard++ < 100000) {
        const d = dashes[dashIdx];
        const sl = Math.abs(d);

        if (sl < EPS) {
          // Dot
          if (d === 0 || d > 0) {
            const cx = ox + (wx + t * cosθ) * s;
            const cy = oy - (wy + t * sinθ) * s;
            ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, Math.PI * 2); ctx.fill();
          }
          dashIdx = (dashIdx + 1) % dashes.length;
          posInSeg = 0;
          continue;
        }

        const remaining = sl - posInSeg;
        const tEnd = Math.min(t + remaining, tMax);

        if (d > 0) {
          ctx.beginPath();
          ctx.moveTo(ox + (wx + t * cosθ) * s, oy - (wy + t * sinθ) * s);
          ctx.lineTo(ox + (wx + tEnd * cosθ) * s, oy - (wy + tEnd * sinθ) * s);
          ctx.stroke();
        }

        t = tEnd;
        dashIdx = (dashIdx + 1) % dashes.length;
        posInSeg = 0;
      }
    }

    // ════════════════════════════════════════
    //  PAT FILE: GENERATE & PARSE
    // ════════════════════════════════════════
    function generatePAT() {
      const name = (document.getElementById('pat-name').value || 'MYPAT')
        .toUpperCase().replace(/[^A-Z0-9_]/g, '_').slice(0, 31);
      const desc = document.getElementById('pat-desc').value || '';
      const lines = [
        `;;   ${name}.pat`,
        `;;   Generated by CAD PAT Designer - ${new Date().toLocaleDateString('zh-TW')}`,
        `;;`,
        `*${name},${desc}`,
      ];
      for (const f of S.fams) {
        if (!f.vis) continue;
        const dashes = parseDashes(f.dashes);
        let line = `${f.angle},${fmtN(f.x0)},${fmtN(f.y0)},${fmtN(f.dx)},${fmtN(f.dy)}`;
        if (dashes.length) line += ',' + dashes.map(fmtN).join(',');
        lines.push(line);
      }
      return lines.join('\n');
    }

    function renderPATOut() {
      const el = document.getElementById('pat-out');
      if (!el) return;
      const raw = generatePAT();
      el.innerHTML = raw.split('\n').map(line => {
        if (line.startsWith(';;')) return `<span class="pc-comment">${esc(line)}</span>`;
        if (line.startsWith('*')) return `<span class="pc-header">${esc(line)}</span>`;
        if (/^-?\d/.test(line)) return `<span class="pc-data">${esc(line)}</span>`;
        return esc(line);
      }).join('\n');
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function exportPAT() {
      const content = generatePAT();
      const name = (document.getElementById('pat-name').value || 'MYPAT').toUpperCase().replace(/[^A-Z0-9_]/g, '_');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name + '.pat'; a.click();
      URL.revokeObjectURL(url);
      showToast('✓ 已匯出 ' + name + '.pat', 'ok');
    }

    function copyPAT() {
      navigator.clipboard.writeText(generatePAT())
        .then(() => showToast('✓ 已複製到剪貼簿', 'ok'))
        .catch(() => showToast('✗ 複製失敗', 'err'));
    }

    function importPAT() { document.getElementById('file-input').click(); }

    function onFile(e) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => { try { parsePAT(ev.target.result, f.name); } catch (err) { showToast('✗ ' + err.message, 'err'); } };
      r.readAsText(f);
      e.target.value = '';
    }

    function parsePAT(text, filename) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      let patterns = [], cur = null;
      for (const line of lines) {
        if (/^[;\/]/.test(line)) continue;
        if (line.startsWith('*')) {
          if (cur) patterns.push(cur);
          const comma = line.indexOf(',');
          cur = {
            name: comma < 0 ? line.slice(1).trim() : line.slice(1, comma).trim(),
            desc: comma < 0 ? '' : line.slice(comma + 1).trim(),
            fams: []
          };
        } else if (cur && /^-?\d/.test(line)) {
          const parts = line.split(',').map(p => parseFloat(p.trim()));
          if (parts.length >= 5) {
            const [angle, x0, y0, dx, dy, ...dp] = parts;
            cur.fams.push({
              angle, x0, y0, dx, dy,
              dashes: dp.length ? dp.map(fmtN).join(',') : '',
              col: COLORS[cur.fams.length % COLORS.length],
              vis: true, id: Date.now() + Math.random()
            });
          }
        }
      }
      if (cur) patterns.push(cur);
      if (!patterns.length) throw new Error('未找到有效 PAT 圖案');
      const p = patterns[0];
      document.getElementById('pat-name').value = p.name;
      document.getElementById('pat-desc').value = p.desc;
      S.fams = p.fams;
      S.sel = S.fams.length > 0 ? 0 : -1;
      renderAll();
      showToast(`✓ 已匯入 ${filename}${patterns.length > 1 ? ' (載入第1個圖案)' : ''}`, 'ok');
    }

    // ════════════════════════════════════════
    //  CANVAS EVENTS
    // ════════════════════════════════════════
    function setupCVEvents() {
      const wrap = document.getElementById('cv-wrap');

      cv.addEventListener('contextmenu', e => e.preventDefault());

      cv.addEventListener('mousedown', e => {
        if (e.button === 2) { S.drag = true; S.dragX = e.clientX; S.dragY = e.clientY; cv.style.cursor = 'grabbing'; }
      });
      cv.addEventListener('mousemove', e => {
        // Coord display
        const rect = cv.getBoundingClientRect();
        const wx = (e.clientX - rect.left - cv.width / 2 - S.panX) / S.scale;
        const wy = (cv.height / 2 + S.panY - (e.clientY - rect.top)) / S.scale;
        document.getElementById('coord-lbl').textContent =
          `x: ${wx.toFixed(4)}  y: ${wy.toFixed(4)}`;

        if (S.drag) {
          S.panX += e.clientX - S.dragX;
          S.panY += e.clientY - S.dragY;
          S.dragX = e.clientX; S.dragY = e.clientY;
          renderCV();
        }
      });
      cv.addEventListener('mouseup', () => { S.drag = false; cv.style.cursor = 'crosshair'; });
      cv.addEventListener('mouseleave', () => { S.drag = false; cv.style.cursor = 'crosshair'; });

      cv.addEventListener('wheel', e => {
        e.preventDefault();
        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - cv.width / 2 - S.panX) / S.scale;
        const wy = -(my - cv.height / 2 - S.panY) / S.scale;
        const factor = e.deltaY < 0 ? 1.12 : 0.9;
        S.scale = Math.max(8, Math.min(500, S.scale * factor));
        S.panX = mx - cv.width / 2 - wx * S.scale;
        S.panY = my - cv.height / 2 + wy * S.scale;
        updateScaleUI();
        renderCV();
      }, { passive: false });

      cv.addEventListener('dblclick', resetView);

      const ro = new ResizeObserver(() => { resizeCV(); renderCV(); });
      ro.observe(wrap);
    }

    function setScale(v) {
      S.scale = v;
      updateScaleUI();
      renderCV();
    }
    function updateScaleUI() {
      document.getElementById('scale-sl').value = Math.round(S.scale);
      document.getElementById('scale-lbl').textContent = Math.round(S.scale);
    }
    function resetView() {
      S.panX = 0; S.panY = 0; S.scale = 80;
      updateScaleUI(); renderCV();
    }

    // ════════════════════════════════════════
    //  PRESETS UI
    // ════════════════════════════════════════
    function renderPresets() {
      document.getElementById('preset-grid').innerHTML =
        Object.keys(PRESETS).map(n => `<button class="preset-btn" onclick="loadPreset('${n}')">${n}</button>`).join('');
    }

    // ════════════════════════════════════════
    //  TOAST
    // ════════════════════════════════════════
    let _toastTimer;
    function showToast(msg, type = '') {
      const el = document.getElementById('toast');
      clearTimeout(_toastTimer);
      el.textContent = msg; el.className = `toast ${type} on`;
      _toastTimer = setTimeout(() => el.classList.remove('on'), 3200);
    }

    // ════════════════════════════════════════
    //  MASTER RENDER
    // ════════════════════════════════════════
    function renderAll() {
      renderFamList();
      renderParams();
      renderCV();
      renderPATOut();
    }

    // ════════════════════════════════════════
    //  KEYBOARD SHORTCUTS
    // ════════════════════════════════════════
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === '+' || e.key === '=') { S.scale = Math.min(500, S.scale * 1.15); updateScaleUI(); renderCV(); }
      if (e.key === '-') { S.scale = Math.max(8, S.scale * .87); updateScaleUI(); renderCV(); }
      if (e.key === 'r' || e.key === 'R') resetView();
      if (e.key === 'n' && !e.ctrlKey) addFamily();
    });

    // ════════════════════════════════════════
    //  INIT
    // ════════════════════════════════════════
    window.addEventListener('load', () => {
      resizeCV();
      setupCVEvents();
      renderPresets();
      // Load ANSI31 by default
      loadPreset('ANSI31');
    });
  </script>
</body>
